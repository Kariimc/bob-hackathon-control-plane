<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Local Control Plane</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to dashboard</a>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">IBM Bob hackathon</p>
          <h1>Control Plane</h1>
        </div>
        <div class="topbar-right">
          <span id="stream-status" class="stream-badge" title="Live push connection status" aria-live="polite"></span>
          <div class="local-badge"><span aria-hidden="true"></span> Local mock</div>
          <a href="/office" class="office-link" aria-label="Open 3D Agent Office">🏢 Agent Office</a>
        </div>
      </header>

      <main id="main">
        <!-- Metrics bar -->
        <div id="metrics-bar" class="metrics-bar" aria-label="Live metrics"></div>

        <!-- Pipeline progress rail -->
        <section aria-labelledby="pipeline-title" class="pipeline-section">
          <p class="eyebrow">Pipeline</p>
          <h2 id="pipeline-title" class="sr-only">Pipeline progress</h2>
          <div id="pipeline-rail" class="pipeline-rail" aria-live="polite"></div>
        </section>

        <section aria-labelledby="services-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Status</p>
              <h2 id="services-title">Services</h2>
            </div>
            <p id="revision" class="revision">Revision 1</p>
          </div>
          <div id="services" class="card-grid" aria-live="polite"></div>
        </section>

        <section class="work-grid">
          <div aria-labelledby="tasks-title">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Workflow</p>
                <h2 id="tasks-title">Tasks</h2>
              </div>
              <div class="heading-actions">
                <button id="refresh" type="button" class="btn-secondary btn-sm">↺ Refresh</button>
                <button id="add-task-toggle" type="button" class="btn-secondary btn-sm">+ New task</button>
              </div>
            </div>

            <!-- Inline task creation form -->
            <form id="new-task-form" class="new-task-form" hidden aria-label="Create new task">
              <input id="new-task-title" type="text" placeholder="Task title" required autocomplete="off" aria-label="Task title" maxlength="200">
              <input id="new-task-owner" type="text" placeholder="Owner" required autocomplete="off" aria-label="Owner" maxlength="100">
              <button type="submit">Create</button>
              <button type="button" id="new-task-cancel" class="btn-secondary">Cancel</button>
            </form>

            <div id="tasks" class="task-list" aria-live="polite"></div>
          </div>

          <aside class="activity-panel" aria-labelledby="activity-title">
            <p class="eyebrow">Evidence</p>
            <h2 id="activity-title">Activity</h2>
            <ul id="activity" class="activity-list"></ul>
          </aside>
        </section>
      </main>
    </div>

    <!-- Reason dialog (block / fail) -->
    <dialog id="reason-dialog" aria-labelledby="reason-dialog-title">
      <form method="dialog" id="reason-form">
        <h2 id="reason-dialog-title">Add a reason</h2>
        <p id="reason-dialog-desc" class="dialog-desc"></p>
        <textarea id="reason-input" rows="3" maxlength="500" placeholder="Optional reason…" aria-label="Reason"></textarea>
        <div class="dialog-actions">
          <button type="submit" id="reason-confirm">Confirm</button>
          <button type="button" id="reason-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </dialog>

    <!-- Toast / notice stack -->
    <div id="notices" class="notices" role="status" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
